<style>
:root{--bg:#111213;--card:#18191b;--card2:#202225;--tx:#e9eaec;--mut:#8b8f96;--ac:#2c857a;--ac2:#3aa595;--grad:#2c857a;--del:#d4605a;--edit:#cfa24a;--ok:#4aa57e;--bd:#2a2c30;--in:#1c1e21}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.i .fl{fill:currentColor;stroke:none}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--bd)}

.tt{line-height:1.2;min-width:0}.tt b{display:block;font-size:15.5px;font-weight:600}.tt span{font-size:12px;color:var(--mut)}

.dtag{display:flex;align-items:center;gap:5px;color:var(--del);font-size:12px;font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}.dtag .i{width:14px;height:14px}
.etag{background:rgba(207,162,74,.16);border:0;color:var(--edit);font-size:11.5px;display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-weight:600}.etag .i{width:12px;height:12px}
.hist{margin-top:6px;padding:7px 9px;border-left:2px solid var(--edit);background:rgba(207,162,74,.1);border-radius:4px;font-size:13.5px;color:var(--tx)}.hist small{display:block;color:var(--mut);font-size:11.5px}
.inf{margin-top:6px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--bd);padding-top:5px}.me .inf{color:rgba(255,255,255,.8)}
.vc{display:flex;align-items:center;gap:10px;min-width:210px}.pb{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.me .pb{background:#fff;color:var(--ac)}
.wv{display:block;position:relative;flex:1}.wv .bb{display:flex;gap:2px;align-items:center;height:26px;width:100%}.wv .bb.f{position:absolute;inset:0;clip-path:inset(0 100% 0 0)}
.wv i{width:3px;border-radius:2px;background:currentColor;opacity:.45}.wv .bb.f i{opacity:1}
.vc.on .bb.f{animation:pg var(--d) linear forwards}@keyframes pg{to{clip-path:inset(0 0 0 0)}}
.circ{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#4b4e54,#2a2c30);display:flex;align-items:center;justify-content:center;color:#fff;margin:2px auto;cursor:pointer}
.circ.on{animation:pl 1.1s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac2) 40%,transparent)}}
.ph{width:230px;max-width:100%;height:150px;border-radius:10px;background:linear-gradient(135deg,#5d6672,#3a4048);display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:3px}.ph .i{width:32px;height:32px}
.mlock,.lk{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px}.lk{margin-top:6px}.mlock{padding:12px;border:1px dashed var(--bd);border-radius:10px;margin:2px 0 4px}.mlock .i,.lk .i{width:14px;height:14px}
.lc{margin-top:8px;border-radius:10px;padding:10px;background:var(--bg);border:1px solid var(--bd);border-left:3px solid var(--lc);color:var(--tx);--lc:var(--ok)}
.lc.m{--lc:var(--edit)}.lc.h{--lc:var(--del)}
.lh{display:flex;gap:10px;align-items:center}
.fav{width:36px;height:36px;border-radius:8px;background:color-mix(in srgb,var(--lc) 18%,transparent);color:var(--lc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.lt{flex:1;min-width:0}.lt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lt span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:11px;font-weight:600;color:var(--lc);border:1px solid var(--lc);padding:3px 7px;border-radius:6px;white-space:nowrap;display:flex;gap:4px;align-items:center;text-transform:uppercase;letter-spacing:.4px}.lv .i{width:12px;height:12px;stroke-width:2.2}
.dest{margin-top:9px;padding:8px 10px;background:var(--card2);border-radius:8px}
.dest small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:3px}
.du{display:flex;gap:6px;align-items:flex-start;font-size:13px;word-break:break-all}.du .i{width:14px;height:14px;margin-top:2px;color:var(--ok)}.du.w .i{color:var(--del)}.du b{font-weight:600}.du b+*{}
.ti{font-size:13px;margin-top:5px;font-weight:500}.via{font-size:12px;color:var(--mut);margin-top:5px}
.lr{height:4px;border-radius:2px;background:var(--card2);margin:9px 0 5px;overflow:hidden}.lr i{display:block;height:100%;background:var(--lc)}
.rk{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}.rk b{font-weight:600}
.rs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.rs em{font-style:normal;font-size:11.5px;background:var(--card2);padding:3px 8px;border-radius:6px}
.la{display:flex;gap:6px;margin-top:9px}.la button{flex:1;border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:13px;font-weight:600;background:var(--card);color:var(--tx);display:flex;gap:5px;align-items:center;justify-content:center}.la button .i{width:15px;height:15px}
.cover{height:120px;position:relative;overflow:hidden;border-bottom:1px solid var(--bd)}
.pav{width:84px;height:84px;border-radius:50%;margin:-42px 14px 0;border:4px solid var(--bg);position:relative;font-size:32px;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;background-size:cover}
.pn{padding:10px 14px 0}.pn b{font-size:21px;font-weight:600;display:block;letter-spacing:-.2px}.pn span{display:flex;gap:5px;align-items:center;margin-top:2px;font-size:14px;color:var(--mut)}
.bio{padding:8px 14px 0;color:var(--tx);font-size:14.5px;opacity:.85}
.cedit{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);border-color:transparent;color:#fff}
.acts{display:flex;gap:8px;margin:14px}.acts button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 4px;font-weight:600;font-size:13px;display:flex;gap:5px;align-items:center;justify-content:center}.acts button.p{background:var(--ac);border-color:var(--ac);color:#fff}.acts .i{width:17px;height:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);overflow:hidden}
.st{padding:12px 6px;text-align:center}.st+.st{border-left:1px solid var(--bd)}.st b{display:block;font-size:21px;font-weight:600}.st small{font-size:11.5px;color:var(--mut)}.st .i{width:18px;height:18px;margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:12px 14px;padding:16px}
.ct{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}.ct .i{width:16px;height:16px}
.age{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;gap:6px}
.age div{background:var(--card2);border-radius:8px;padding:11px 2px 8px;text-align:center}.age div:first-child{background:none;border:1px solid var(--ac2)}
.age b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}.age small{font-size:10.5px;color:var(--mut)}
.yb{height:4px;border-radius:2px;background:var(--card2);margin:14px 0 7px;overflow:hidden}.yb i{display:block;height:100%;background:var(--ac2);transition:width 1s linear}
.sm{font-size:12.5px;color:var(--mut)}.sm b{color:var(--tx);font-weight:600}
.plc{margin:12px 14px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.plc b{font-size:15.5px;display:block;font-weight:600}.plc span{font-size:13px;color:var(--mut)}.plc button{margin-left:auto;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13.5px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0}.li+.li{border-top:1px solid var(--bd)}.li>.i{color:var(--mut)}.li .g{flex:1}.li .v{color:var(--mut);font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:8px;padding:2px;gap:2px}.seg button{border:0;background:none;color:var(--tx);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500}.seg button.on{background:var(--ac);color:#fff}
.sw2{display:flex;gap:8px}.sw2 button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px var(--bd)}.sw2 button.on{border-color:var(--tx)}.sw2 button.lk2{opacity:.4}
input.f,textarea.f{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px;font-size:15px;outline:0;font-family:inherit}
textarea.f{resize:none;height:84px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:600;font-size:15px;width:100%;margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center}.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.plan{margin:12px 14px;background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--bd)}.plan.cur{border-color:var(--ac2)}
.plan h4{font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}.plan h4 small{font-size:13px;color:var(--mut);font-weight:400}
.un{font-size:12.5px;color:var(--ok);margin-top:2px}
.frs{margin:12px 0 4px}.fr{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-top:1px solid var(--bd)}.fr .i{width:16px;height:16px;color:var(--ok)}.fr span{flex:1}.fr b{font-weight:600;color:var(--tx);font-size:13px}.fr.off{color:var(--mut);opacity:.6}.fr.off .i{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
.sec{padding:0 16px;margin:14px 0 4px;font-size:12.5px;color:var(--mut)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sh{width:100%;max-height:92vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.sh h3{font-size:17px;font-weight:600;margin-bottom:14px;text-align:center}
.eav{width:84px;height:84px;margin:0 auto 6px;position:relative}.eav .pav{margin:0;border:0}
.eav label{position:absolute;right:-4px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.fl2{margin-top:12px}.fl2 small{display:block;font-size:12px;color:var(--mut);margin:0 2px 5px}
.note{font-size:12.5px;color:var(--mut);margin-top:10px;text-align:center}
.quote{border-left:2px solid var(--ac2);background:rgba(127,127,127,.14);border-radius:6px;padding:4px 8px;margin-bottom:5px;font-size:13px}.quote b{display:block;color:var(--ac2);font-size:12px}.me .quote{border-color:#fff}.me .quote b{color:#fff}
.sumbar{display:flex;margin:10px 14px 2px;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden}.sumbar div{flex:1;padding:8px 6px;text-align:center;font-size:11.5px;color:var(--mut)}.sumbar div+div{border-left:1px solid var(--bd)}.sumbar b{display:flex;gap:5px;justify-content:center;align-items:center;font-size:16px;font-weight:600}.sumbar .i{width:15px;height:15px}

mark{background:var(--edit);color:#241a00;border-radius:3px;padding:0 2px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mg div{aspect-ratio:1;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;position:relative;color:var(--mut)}.mg .x{position:absolute;right:4px;top:4px;width:17px;height:17px;border-radius:5px;background:var(--del);color:#fff;display:flex;align-items:center;justify-content:center}.mg .x .i{width:11px;height:11px;stroke-width:2.4}

/* GhostChat — clean Telegram-native visual system */
:root{
 --bg:#17212b;--card:#202b36;--card2:#263442;--tx:#f5f7fa;--mut:#91a2b2;
 --ac:#229ed9;--ac2:#38c7f4;--grad:#229ed9;--del:#f45d78;--edit:#f5b942;
 --ok:#36c995;--bd:#2b3947;--in:#1d2a37;color-scheme:dark
}
:root[data-t=light]{
 --bg:#f2f5f8;--card:#ffffff;--card2:#e9f0f5;--tx:#17212b;--mut:#718394;
 --ac:#229ed9;--ac2:#38bdf0;--grad:#229ed9;--del:#e94f6d;--edit:#e8a62b;
 --ok:#19a879;--bd:#dce5ec;--in:#f6f9fb;color-scheme:light
}
body{background:var(--bg);color:var(--tx);background-image:none}
header{background:var(--bg);border-bottom:1px solid var(--bd);backdrop-filter:none}
header h1{font-size:18px;font-weight:650;letter-spacing:-.3px}
.pill{background:#229ed9;color:#fff;border:0;border-radius:999px;font-size:11px;letter-spacing:.35px;padding:5px 11px}
.ib{background:var(--card2);border:1px solid var(--bd);border-radius:11px;color:var(--tx)}
#app{padding-bottom:112px}
nav{
 position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));
 display:flex;align-items:stretch;justify-content:space-around;gap:3px;
 padding:7px 8px;background:#202b36;border:1px solid #344555;border-radius:31px;
 box-shadow:0 8px 26px rgba(0,0,0,.28);backdrop-filter:none;-webkit-backdrop-filter:none;z-index:20
}
:root[data-t=light] nav{background:#fff;border-color:#dbe5ed;box-shadow:0 7px 22px rgba(35,72,98,.16)}
nav button{flex:1;min-width:0;min-height:66px;padding:7px 2px 6px;border:0;border-radius:23px;background:transparent;color:#9aabba;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;white-space:nowrap}
nav button .nav-ico{height:33px;width:100%;display:flex;align-items:center;justify-content:center}
nav button .i{width:27px;height:27px;stroke-width:1.9}
nav button .nav-label{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
nav button.on{color:#fff;background:#229ed9;box-shadow:none}
nav button.on .i{stroke-width:2}
:root[data-t=light] nav button{color:#74899a}
:root[data-t=light] nav button.on{color:#fff;background:#229ed9}
.srch{background:var(--card);border:1px solid var(--bd);border-radius:17px;padding:0 14px}
.srch input{color:var(--tx)}
.ch{border-bottom:1px solid var(--bd);padding:13px 14px}
.ch:active{background:var(--card2)}
.av{box-shadow:none}
.chips{gap:7px;padding:11px 14px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:8px 13px;color:var(--tx)}
.chip.on{background:#229ed9;border-color:#229ed9;color:#fff}
.cb{background:#ef5874;border-radius:7px}
.cb.e{background:#f4b83f;color:#352600}
.b{background:var(--in);border:1px solid var(--bd);border-radius:14px 14px 14px 5px}
.me .b{background:#2b9ed6;border-color:transparent;color:#fff;border-radius:14px 14px 5px 14px}
.b.d{background:rgba(239,88,116,.10);border-color:rgba(239,88,116,.35)}
.card,.plan{background:var(--card);border:1px solid var(--bd);border-radius:17px;box-shadow:none}
.plan.cur{border:1.5px solid #229ed9;box-shadow:0 0 0 1px rgba(34,158,217,.12)}
.btn{border-radius:12px;font-weight:650}
.btn:not(.g){background:#229ed9!important;color:#fff!important;border:1px solid #229ed9!important;box-shadow:none}
.btn.g{background:var(--card2);border:1px solid var(--bd);color:var(--tx)}
.plan .fr .i{color:#38c7f4}
.plan .fr.off{opacity:.4}

function vPlans(){

  return `<div class="card"><div class="ct">${I("star")}${t("pay")}: ${PL[l].toUpperCase()}</div><p style="color:var(--mut);font-size:14px">После создания заявки реквизиты будут выданы сервером. Тариф включится только после проверки транзакции.</p>

 const until=+localStorage.gpu;
 return `<div style="padding:12px 14px 0"><div class="seg" style="width:150px"><button class="${S.cur==="gram"?"on":""}" data-cu="gram" style="flex:1">Gram</button><button class="${S.cur==="usd"?"on":""}" data-cu="usd" style="flex:1">$</button></div></div>`+
 PL.map((p,l)=>{const pr=l?CFG.PRICES[p][S.cur]:0;
  const rows=ROWS.map(([k,v])=>{const x=v[l];return `<div class="fr ${x?"":"off"}">${I(x?"ok":"lock")}<span>${t(k)}</span>${typeof x==="string"?`<b>${x}</b>`:""}</div>`}).join("");
  return `<div class="plan ${S.plan===l?"cur":""}"><h4>${l?p[0].toUpperCase()+p.slice(1):t("free")}<span>${pr}${S.cur==="usd"?" $":" Gram"}<small>${t("month")}</small></span></h4>${S.plan===l&&l&&until?`<div class="un">${t("until")} ${new Date(until).toLocaleDateString(S.lang)}</div>`:""}<div class="frs">${rows}</div>
  <button class="btn ${S.plan===l?"g":""}" data-plan-select="${l}" style="margin-top:6px">${S.plan===l?I("ok")+t("cur"):t("switchTo")}</button></div>`}).join("")}
function render(){
 document.documentElement.dataset.t=S.theme;
 const A=ACC[LM().acc?S.acc:"mint"]||ACC.mint,rs=document.documentElement.style;rs.setProperty("--ac",A[1]);rs.setProperty("--ac2",A[0]);rs.setProperty("--grad",A[1]);
 const cv=S.cv&&CHATS.find(z=>z.id===S.cv),c=S.chat&&CHATS.find(z=>z.id===S.chat),inChat=S.tab==="chats"&&c&&!cv,back=cv||inChat||S.sub;
 $("#hd").innerHTML=(back?`<button class="ib" id="back">${I("back")}</button>`:"")+(cv?`<h1>${t("prof")}</h1>`:inChat?`<div class="hdl" data-cv="${c.id}">${av(c,"width:40px;height:40px;font-size:16px")}<div class="tt"><b>${esc(c.name)}</b><span>${c.un}</span></div></div><button class="ib" data-exp="1">${I(LM().exp?"dl":"lock")}</button><button class="ib" data-cso="1">${I("search")}</button>`:`<h1>${S.sub?t("plans"):S.tab==="chats"?"GhostChat":t(S.tab)}</h1>${S.tab==="chats"&&tg.initData?`<button class="ib" id="gcNewChat" title="Новый чат">${I("arrow")}</button>`:""}<span class="pill">${PL[S.plan].toUpperCase()}</span>`);
 $("#nav").style.display=cv||inChat?"none":"flex";
 $("#nav").innerHTML=[["chats","chat"],["log","trash"],["links","link"],["prof","user"],["plans","star"]].map(([k,i])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}"><span class="nav-ico">${I(i)}</span><span class="nav-label">${t(k)}</span></button>`).join("");
 $("#app").innerHTML=(cv?vContact(cv):({chats:vChats,log:vLog,links:vLinks,prof:vProf,plans:vPlans})[S.tab]())+(S.pe?sheet():"")}
document.addEventListener("click",async e=>{const q=s=>e.target.closest(s);let el;
 if(el=q("[data-pe]")){const u=U();S.pd={fn:u.first_name||"",ln:u.last_name||"",un:u.username||"",bio:u.bio||"",av:u.photo_url||""};S.pe=1;render()}
 else if(q("[data-cancel]")||e.target.classList.contains("sheet")){S.pe=0;render()}
 else if(q("[data-sp]")){const d=S.pd;if(d.fn.trim()){localStorage.gprof=JSON.stringify({fn:d.fn.trim(),ln:d.ln.trim(),bio:d.bio.trim()});if(d.av)localStorage.gav=d.av;else localStorage.removeItem("gav");try{await saveGCProfile(d)}catch(e){tg.showAlert(e.message)}}S.pe=0;render()}
 else if(el=q("[data-bp]")){const v=el.dataset.bp;if(v==="x"){localStorage.removeItem("gbp");localStorage.removeItem("gban")}else{localStorage.gbp=v;localStorage.removeItem("gban")}render()}
 else if(el=q("[data-acc]")){if(!LM().acc&&el.dataset.acc!=="mint")return need(1);S.acc=el.dataset.acc;localStorage.gacc=S.acc;render()}
 else if(el=q("[data-cv]")){S.cv=el.dataset.cv;render();scrollTo(0,0)}
 else if(el=q("[data-go]")){S.chat=el.dataset.id;S.cv=null;S.tab="chats";S.filter=el.dataset.go==="log"?"del":"all";S.cs="";S.cso=0;render();scrollTo(0,document.body.scrollHeight)}
 else if(q("[data-cso]")){S.cso=!S.cso;if(!S.cso)S.cs="";render();if(S.cso)$("#cq")?.focus()}
 else if(el=q("[data-lf]")){S.lf=el.dataset.lf;render()}
 else if(q("[data-bot]")){scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
 else if(el=q("[data-open]")){const go=()=>tg.openLink(el.dataset.open);el.dataset.lv==="h"?(tg.showConfirm?tg.showConfirm(t("confirm"),ok=>ok&&go()):confirm(t("confirm"))&&go()):go()}
 else if(el=q("[data-deep]")){if(!has(2))return tg.showAlert(t("lockT")+" Pro");tg.openLink("https://t.me/"+CFG.BOT+"?start=scan_"+btoa(unescape(encodeURIComponent(el.dataset.deep))).replace(/=/g,""))}
 else if(el=q("[data-tab]")){S.tab=el.dataset.tab;S.chat=null;S.sub=null;S.cv=null;render();scrollTo(0,0)}
 else if(el=q("[data-c]")){S.chat=el.dataset.c;S.filter="all";S.cs="";S.cso=0;render();scrollTo(0,document.body.scrollHeight)}
 else if(el=q("[data-f]")){S.filter=el.dataset.f;render()}
 else if(q("#back")){S.cv?S.cv=null:S.sub?S.sub=null:(S.chat=null,S.cs="",S.cso=0);render()}
 else if(el=q("[data-x]")){const k=el.dataset.x;S.open.has(k)?S.open.delete(k):S.open.add(k);render()}
 else if(q("#chk")){S.man=$("#lk").value.trim();render()}
 else if(q("[data-ed]")){S.ed=!S.ed;render()}
 else if(el=q("[data-lang]")){S.lang=el.dataset.lang;localStorage.gl=S.lang;render()}
 else if(el=q("[data-th]")){S.theme=el.dataset.th;localStorage.gt=S.theme;render()}
 else if(el=q("[data-cu]")){S.cur=el.dataset.cu;render()}
 else if(el=q("[data-plan-select]")){await setPlan(el.dataset.planSelect);if(+el.dataset.planSelect===0){S.sub=null;render()}else render()}
 else if(el=q("#pd")){try{const p=await gcApi("request_payment",{plan:+el.dataset.p,currency:S.cur==="usd"?"usdt":"gram"});S.sub={payment:p.payment};render()}catch(e){tg.showAlert(e.message)}}
 else if(q("#gcCopyWallet")){navigator.clipboard?.writeText($("#gcWallet").textContent);tg.showAlert("Адрес скопирован")}
 else if(el=q("#gcSubmitTx")){const transaction_hash=$("#gcTxHash")?.value.trim();if(!transaction_hash)return tg.showAlert("Введи хеш транзакции");try{await gcApi("submit_payment_tx",{payment_id:el.dataset.payment,transaction_hash});tg.showAlert("Хеш отправлен. Подписка активируется после проверки оплаты.")}catch(e){tg.showAlert(e.message)}}
 else if(q("#gcBackPlans")){S.sub=null;render()}
 else if(el=q("#gcNewChat")){const title=prompt("Название нового чата:");if(title&&title.trim()){try{const r=await gcApi("create_chat",{title:title.trim()});await load();S.chat=r.chat.id;render()}catch(e){tg.showAlert(e.message)}}}
 else if(q("#gcSend")){const inp=$("#gcDraft"),content=inp?.value.trim();if(content){try{await gcApi("send_message",{chat_id:CHATS.find(c=>c.id===S.chat)?.dbid,content});await load();S.chat=CHATS.find(c=>c.dbid===S.chat)?.id||S.chat;render()}catch(e){tg.showAlert(e.message)}}}
 else if(q("#sd")){const v=$("#rd").value;if(v){localStorage.greg=new Date(v).toISOString();S.ed=0;render()}}
 else if(q("#rs")){delete localStorage.greg;S.ed=0;render()}
 
 else if(el=q("[data-pin]")){const id=el.dataset.pin,a=PIN(),i=a.indexOf(id);if(i<0&&PINS().length>=LM().pins)return need(Math.min(2,S.plan+1));i<0?a.push(id):a.splice(i,1);localStorage.gpin=JSON.stringify(a);render()}
 else if(el=q("[data-lockx]")){need(+el.dataset.lockx||1)}
 else if(q("[data-exp]")){if(!LM().exp)return need(2);const c=CHATS.find(z=>z.id===S.chat),D=v=>new Date(v).toLocaleString(S.lang);
  const tx=c.msgs.map(x=>`[${D(x.ts)}] ${x.me?t("you"):c.name}: ${x.type==="text"?x.text:"<"+t(x.type)+">"}${x.deleted?`  (${t("deleted")} ${D(x.deleted)})`:""}${x.edited?`  (${t("edited")} ${D(x.edited)}; ${t("first")}: ${x.hist[0].t})`:""}`).join("\n");
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([tx],{type:"text/plain"}));a.download="chat_"+c.id+".txt";a.click()}catch(_){}navigator.clipboard?.writeText(tx);tg.showAlert(t("exported"))}
 else if(el=q(".pb,.circ")){const w=el.closest(".vc")||el,on=w.classList.toggle("on"),ic=w.querySelector(".pb"),PL2='<svg class="i"><use href="#i-play"/></svg>',d=parseFloat(getComputedStyle(w).getPropertyValue("--d"))||5;
  if(ic)ic.innerHTML=on?'<svg class="i"><use href="#i-pause"/></svg>':PL2;clearTimeout(w._t);if(on)w._t=setTimeout(()=>{w.classList.remove("on");if(ic)ic.innerHTML=PL2},d*1000)}
 else if(el=q(".b[data-i]")){const k="i"+el.dataset.i;S.open.has(k)?S.open.delete(k):S.open.add(k);render()}});
document.addEventListener("input",e=>{const i=e.target;
 if(i.id==="q"||i.id==="cq"){S[i.id==="q"?"q":"cs"]=i.value;const p=i.selectionStart,id=i.id;render();const n=$("#"+id);n.focus();n.setSelectionRange(p,p)}
 else if(i.dataset.pd)S.pd[i.dataset.pd]=i.value;

document.addEventListener("change",e=>{const i=e.target,f=i.files&&i.files[0];if(!f||!(i.id==="pf"||i.dataset.ban))return;if(i.dataset.ban&&!LM().ban)return need(1);const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const b=!!i.dataset.ban,W=b?900:256,H=b?360:256,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d"),k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);const d=cv.toDataURL("image/jpeg",.85);if(b){try{localStorage.gban=d;localStorage.removeItem("gbp")}catch(_){}}else S.pd.av=d;render()};im.src=r.result};r.readAsDataURL(f)});
